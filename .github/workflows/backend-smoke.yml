name: backend-smoke

on:
  push:
    paths:
      - "apps/backend/**"
      - "docker-compose.yml"
      - ".github/workflows/backend-smoke.yml"
  pull_request:
    paths:
      - "apps/backend/**"
      - "docker-compose.yml"
      - ".github/workflows/backend-smoke.yml"

jobs:
  smoke:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend
        run: pip install -r requirements.txt
      - name: Unit tests
        run: pytest -q
      - name: Compose up and smoke health
        working-directory: .
        run: |
          docker compose up -d --build db backend
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8000/api/v1/health; then
              exit 0
            fi
            sleep 2
          done
          docker compose logs backend
          exit 1
